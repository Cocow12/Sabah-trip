<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>沙巴旅行手册 · Sabah Trip</title>
<style>
  html{ color-scheme: light dark; }
  :root{
    --radius: 10px;
  }
  body.night{
    --bg:#14201c; --bg-elev:#1c2b25; --bg-elev2:#223530;
    --text:#f2efe6; --text-dim:#cdd8d2;
    --accent:#e8a33d; --accent-soft:#f0c26e; --accent-ink:#1c150a;
    --line: rgba(242,239,230,0.14);
    --danger:#e2725b; --ok:#7fb88a;
  }
  body.day{
    --bg:#f4efe2; --bg-elev:#ffffff; --bg-elev2:#fbf7ee;
    --text:#22302a; --text-dim:#5a6a62;
    --accent:#c97a2b; --accent-soft:#e0a85c; --accent-ink:#fff8ec;
    --line: rgba(34,48,42,0.12);
    --danger:#b8422f; --ok:#3c7d4c;
  }

  *{box-sizing:border-box;}
  html, body{ height:auto; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.6; transition:background .4s,color .4s;
    -webkit-overflow-scrolling:touch;
  }
  .sans{font-family:'Helvetica Neue',Arial,sans-serif;}
  .wrap{max-width:760px; margin:0 auto; padding:0 20px 90px;}
  a{color:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--bg); border-bottom:1px solid var(--line);
    padding:14px 20px;
  }
  .topbar-row{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .brand{font-size:15px; font-weight:600; letter-spacing:.02em;}
  .brand .sub{display:block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--accent-soft); letter-spacing:.08em; margin-top:2px;}
  .tabs{display:flex; gap:6px;}
  .tab-btn{
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; white-space:nowrap;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:7px 12px; border-radius:999px; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  .theme-toggle{
    margin-left:8px; background:none; border:1px solid var(--line); color:var(--text-dim);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px;
  }

  /* ---------- countdown ---------- */
  .countdown{
    margin-top:22px; padding:22px; border-radius:var(--radius);
    background:var(--bg-elev); border:1px solid var(--line);
  }
  .countdown .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--accent-soft); letter-spacing:.06em;}
  .countdown h2{margin:6px 0 14px; font-size:21px;}
  .countdown .nums{display:flex; gap:14px;}
  .countdown .num-box{flex:1; text-align:center; background:var(--bg-elev2); border-radius:8px; padding:10px 4px;}
  .countdown .num{font-size:26px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--accent);}
  .countdown .lbl{font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; color:var(--text-dim); margin-top:2px;}

  h2.section-title{
    margin:40px 0 16px; font-size:22px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  h2.section-title::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block;}

  /* ---------- map ---------- */
  .map-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; overflow:hidden;}
  .map-card svg{width:100%; height:auto; display:block;}
  .map-legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim);}
  .map-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  /* ---------- confirmed bookings ---------- */
  .booking-card{
    background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .booking-card .kind{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--accent-soft); letter-spacing:.06em; margin-bottom:4px;}
  .booking-card h3{margin:0 0 8px; font-size:17px;}
  .booking-card .row{font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px; color:var(--text-dim); margin-top:3px;}
  .booking-card .row b{color:var(--text); font-weight:600;}
  .booking-card a.maplink{
    display:inline-block; margin-top:10px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px;
    color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent);
  }
  .tag{
    display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px;
    padding:2px 9px; border-radius:3px; margin-left:8px; vertical-align:middle;
  }
  .tag.ok{background:var(--ok); color:#0d1a10;}
  .tag.warn{background:var(--danger); color:#2a0d06;}
  .tag.tbc{background:var(--line); color:var(--text-dim);}

  /* ---------- itinerary days ---------- */
  .day{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .day-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; cursor:pointer;}
  .day-head .d-info .d-date{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--accent-soft);}
  .day-head .d-info h3{margin:2px 0 0; font-size:17px;}
  .day-head .chev{font-size:14px; color:var(--text-dim); transition:transform .2s;}
  .day.open .chev{transform:rotate(180deg);}
  .day-body{display:none; padding:0 16px 16px;}
  .day.open .day-body{display:block;}
  .timeline-item{display:flex; gap:14px; padding:10px 0; border-top:1px solid var(--line);}
  .timeline-item:first-child{border-top:none;}
  .timeline-item .t{width:56px; flex-shrink:0; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--accent-soft); padding-top:2px;}
  .timeline-item .c{flex:1; font-size:15px;}
  .timeline-item .c a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent); font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px;}
  .day-nav{margin-top:10px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px;}
  .day-nav a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent);}

  /* ---------- todo / tips ---------- */
  .plain-list{list-style:none; padding:0; margin:0;}
  .plain-list li{
    padding:12px 16px; background:var(--bg-elev); border:1px solid var(--line);
    border-radius:8px; margin-bottom:8px; font-size:15px;
  }
  .tips-grid{display:grid; grid-template-columns:1fr; gap:8px;}
  .tip-item{background:var(--bg-elev); border:1px solid var(--line); border-radius:8px; padding:12px 16px; font-size:14.5px;}
  .tip-item b{color:var(--accent);}

  /* ---------- ledger ---------- */
  .ledger-summary{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:20px;}
  .ledger-summary .total{font-size:28px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif;}
  .ledger-summary .sub{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .settle-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--bg-elev2); border-radius:8px; padding:12px 14px; margin-top:10px;
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px;
  }
  .settle-row .amt{color:var(--danger); font-weight:700; font-size:15px;}

  form.add-expense{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:20px;}
  form.add-expense h3{margin:0 0 12px; font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%; padding:10px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:14.5px; font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .check-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .check-pill{
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px;
    border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; user-select:none;
  }
  .check-pill.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn{
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:14px; font-weight:600;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
    padding:11px 18px; cursor:pointer; width:100%;
  }
  .btn.secondary{background:none; border:1px solid var(--line); color:var(--text-dim); font-weight:400;}
  .expense-item{
    display:flex; justify-content:space-between; align-items:flex-start;
    background:var(--bg-elev); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:8px;
  }
  .expense-item .meta{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim); margin-top:3px;}
  .expense-item .amt{font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:15px;}
  .del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; padding:0 0 0 10px;}
  .member-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .member-chip{
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px;
    background:var(--bg-elev2); border-radius:999px; padding:6px 12px;
    display:flex; align-items:center; gap:6px;
  }
  .member-chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px;}
  .ledger-note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); margin-bottom:16px; padding:10px 12px; background:var(--bg-elev2); border-radius:8px;}
  #ledger-status{font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; color:var(--text-dim); text-align:center; padding:20px 0;}

  footer{text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--text-dim); margin-top:50px;}
</style>
</head>

/* =================== 主题：日夜自动切换（不用 localStorage，避免部分浏览器隐私模式下报错） =================== */
let manualTheme = null;
function applyTheme(){
  try{
    const hour = new Date().getHours();
    const auto = (hour >= 6 && hour < 18) ? 'day' : 'night';
    document.body.className = manualTheme || auto;
  }catch(e){ console.error('theme error', e); }
}
try{
  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.body.className;
    manualTheme = current === 'night' ? 'day' : 'night';
    document.body.className = manualTheme;
  });
}catch(e){ console.error('theme toggle bind error', e); }
applyTheme();
setInterval(applyTheme, 60000);

/* =================== 倒计时 =================== */
function updateCountdown(){
  try{
    const now = new Date();
    const next = EVENTS.find(e => new Date(e.t) > now);
    if(!next){
      document.getElementById('cd-title').textContent = '旅程已经结束啦 🎉';
      ['cd-d','cd-h','cd-m','cd-s'].forEach(id => document.getElementById(id).textContent = '0');
      return;
    }
    document.getElementById('cd-title').textContent = next.label;
    const diff = new Date(next.t) - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-d').textContent = d;
    document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
    document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
    document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
  }catch(e){ console.error('countdown error', e); }
}
updateCountdown();
setInterval(updateCountdown, 1000);

function gmaps(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
function gmapsDir(stops){
  if(!stops.length) return '#';
  const origin = stops[0], dest = stops[stops.length-1], mid = stops.slice(1,-1);
  let url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(origin) + '&destination=' + encodeURIComponent(dest);
  if(mid.length) url += '&waypoints=' + encodeURIComponent(mid.join('|'));
  return url;
}

/* =================== 记账 =================== */
let ledgerData = { members: [], expenses: [] };
let selectedParticipants = new Set();

async function loadLedger(){
  const statusEl = document.getElementById('ledger-status');
  statusEl.textContent = '加载中…';
  try{
    const res = await fetch('/api/expenses');
    if(!res.ok) throw new Error('bad response');
    ledgerData = await res.json();
    statusEl.textContent = '';
    renderLedger();
  }catch(err){
    statusEl.textContent = '记账功能还没连上后端（需要先在 Cloudflare 完成 KV 数据库绑定，见部署说明）。';
  }
}

function renderLedger(){
  // members
  const memberRow = document.getElementById('memberRow');
  memberRow.innerHTML = '';
  ledgerData.members.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'member-chip';
    chip.innerHTML = `<span>${m}</span><button data-name="${m}">✕</button>`;
    chip.querySelector('button').addEventListener('click', () => removeMember(m));
    memberRow.appendChild(chip);
  });

  // payer select
  const payerSel = document.getElementById('expPayer');
  payerSel.innerHTML = ledgerData.members.map(m => `<option value="${m}">${m}</option>`).join('');

  // participants pills
  const partWrap = document.getElementById('expParticipants');
  partWrap.innerHTML = '';
  if(selectedParticipants.size === 0) ledgerData.members.forEach(m => selectedParticipants.add(m));
  ledgerData.members.forEach(m => {
    const pill = document.createElement('div');
    pill.className = 'check-pill' + (selectedParticipants.has(m) ? ' sel' : '');
    pill.textContent = m;
    pill.addEventListener('click', () => {
      if(selectedParticipants.has(m)) selectedParticipants.delete(m); else selectedParticipants.add(m);
      renderLedger();
    });
    partWrap.appendChild(pill);
  });

  // expense list
  const listEl = document.getElementById('expenseList');
  listEl.innerHTML = '';
  if(ledgerData.expenses.length === 0){
    listEl.innerHTML = '<div class="ledger-note">还没有账目，添加第一笔吧。</div>';
  }
  [...ledgerData.expenses].sort((a,b) => b.createdAt - a.createdAt).forEach(e => {
    const div = document.createElement('div');
    div.className = 'expense-item';
    const each = (e.amount / e.participants.length).toFixed(2);
    div.innerHTML = `
      <div>
        <div>${e.desc}</div>
        <div class="meta">${e.payer} 垫付 · ${e.participants.length}人平分 · 每人 RM${each}</div>
      </div>
      <div style="text-align:right; display:flex; align-items:center;">
        <div class="amt">RM${e.amount.toFixed(2)}</div>
        <button class="del-btn" title="删除">🗑</button>
      </div>
    `;
    div.querySelector('.del-btn').addEventListener('click', () => deleteExpense(e.id));
    listEl.appendChild(div);
  });

  // totals + settlement
  const total = ledgerData.expenses.reduce((s,e) => s + e.amount, 0);
  document.getElementById('ledgerTotal').textContent = 'RM ' + total.toFixed(2);

  const balance = {};
  ledgerData.members.forEach(m => balance[m] = 0);
  ledgerData.expenses.forEach(e => {
    const share = e.amount / e.participants.length;
    balance[e.payer] = (balance[e.payer] || 0) + e.amount;
    e.participants.forEach(p => { balance[p] = (balance[p] || 0) - share; });
  });

  const settleEl = document.getElementById('settlements');
  settleEl.innerHTML = '';
  const debtors = Object.entries(balance).filter(([,v]) => v < -0.01).map(([n,v]) => [n,-v]).sort((a,b)=>b[1]-a[1]);
  const creditors = Object.entries(balance).filter(([,v]) => v > 0.01).sort((a,b)=>b[1]-a[1]);
  let di = 0, ci = 0;
  const transfers = [];
  while(di < debtors.length && ci < creditors.length){
    const [dName, dAmt] = debtors[di];
    const [cName, cAmt] = creditors[ci];
    const pay = Math.min(dAmt, cAmt);
    transfers.push([dName, cName, pay]);
    debtors[di][1] -= pay;
    creditors[ci][1] -= pay;
    if(debtors[di][1] < 0.01) di++;
    if(creditors[ci][1] < 0.01) ci++;
  }
  if(transfers.length === 0){
    settleEl.innerHTML = '<div class="sub sans">目前收支刚好打平，谁都不欠谁。</div>';
  } else {
    transfers.forEach(([from,to,amt]) => {
      const row = document.createElement('div');
      row.className = 'settle-row';
      row.innerHTML = `<span>${from} → ${to}</span><span class="amt">RM${amt.toFixed(2)}</span>`;
      settleEl.appendChild(row);
    });
  }
}

async function postAction(payload){
  const res = await fetch('/api/expenses', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('request failed');
  ledgerData = await res.json();
  renderLedger();
}

  input.value = '';
});

function removeMember(name){
  if(confirm(`把 ${name} 从成员名单移除？`)) postAction({ action:'removeMember', name });
}

document.getElementById('addExpenseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const desc = document.getElementById('expDesc').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const payer = document.getElementById('expPayer').value;
  const participants = [...selectedParticipants];
  if(!desc || !amount || !payer || participants.length === 0) return;
  await postAction({ action:'addExpense', desc, amount, payer, participants });
  document.getElementById('expDesc').value = '';
  document.getElementById('expAmount').value = '';
});

function deleteExpense(id){
  postAction({ action:'deleteExpense', id });
}
