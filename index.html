<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>沙巴旅行手册 · Sabah Trip</title>
<style>
  html{ color-scheme: light dark; }
  :root{ --radius: 10px; }
  body.night{
    --bg:#14201c; --bg-elev:#1c2b25; --bg-elev2:#223530;
    --text:#f2efe6; --text-dim:#cdd8d2;
    --accent:#e8a33d; --accent-soft:#f0c26e; --accent-ink:#1c150a;
    --line: rgba(242,239,230,0.14);
    --danger:#e2725b; --ok:#7fb88a;
  }
  body.day{
    --bg:#f4efe2; --bg-elev:#ffffff; --bg-elev2:#fbf7ee;
    --text:#22302a; --text-dim:#5a6a62;
    --accent:#c97a2b; --accent-soft:#e0a85c; --accent-ink:#fff8ec;
    --line: rgba(34,48,42,0.12);
    --danger:#b8422f; --ok:#3c7d4c;
  }

  *{box-sizing:border-box;}
  html, body{ height:auto; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.6; transition:background .4s,color .4s;
    -webkit-overflow-scrolling:touch;
  }
  .sans{font-family:'Helvetica Neue',Arial,sans-serif;}
  .wrap{max-width:760px; margin:0 auto; padding:0 20px 90px;}
  a{color:inherit;}

  .topbar{ background:var(--bg); border-bottom:1px solid var(--line); padding:14px 20px; }
  .topbar-row{max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .brand{font-size:15px; font-weight:600; letter-spacing:.02em;}
  .brand .sub{display:block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; color:var(--accent-soft); letter-spacing:.08em; margin-top:2px;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab-btn{
    font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; white-space:nowrap;
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:7px 12px; border-radius:999px; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
  .theme-toggle{
    margin-left:8px; background:none; border:1px solid var(--line); color:var(--text-dim);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px;
  }

  .countdown{ margin-top:22px; padding:22px; border-radius:var(--radius); background:var(--bg-elev); border:1px solid var(--line); }
  .countdown .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--accent-soft); letter-spacing:.06em;}
  .countdown h2{margin:6px 0 14px; font-size:21px;}
  .countdown .nums{display:flex; gap:14px;}
  .countdown .num-box{flex:1; text-align:center; background:var(--bg-elev2); border-radius:8px; padding:10px 4px;}
  .countdown .num{font-size:26px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif; color:var(--accent);}
  .countdown .lbl{font-family:'Helvetica Neue',Arial,sans-serif; font-size:10.5px; color:var(--text-dim); margin-top:2px;}

  h2.section-title{ margin:40px 0 16px; font-size:22px; font-weight:600; display:flex; align-items:center; gap:10px; }
  h2.section-title::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block;}
  h3.sub-title{ margin:26px 0 12px; font-size:17px; font-weight:600; color:var(--accent-soft); font-family:'Helvetica Neue',Arial,sans-serif; }

  .map-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; overflow:hidden;}
  .map-card svg{width:100%; height:auto; display:block;}
  .map-legend{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim);}
  .map-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .card .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card h3{margin:0 0 6px; font-size:17px;}
  .card .row{font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px; color:var(--text-dim); margin-top:3px;}
  .card .note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); font-style:italic; margin-top:6px;}

  .tag-chip{ display:inline-block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; padding:3px 9px; border-radius:999px; margin:2px 4px 2px 0; font-weight:600; }
  .clr-cream{background:#f0ead6; color:#4a4030;}
  .clr-gold{background:#f3d38b; color:#5c4210;}
  .clr-sage{background:#cfe0c8; color:#2f4a2a;}
  .clr-sky{background:#cddced; color:#223a5c;}
  .clr-rose{background:#f0d3d6; color:#5c2530;}
  .clr-all{background:#bfe3c0; color:#204a26;}

  .icon-btns{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{ background:none; border:1px solid var(--line); color:var(--text-dim); border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }

  .day-card{ background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; }
  .day-card .day-head{ padding:14px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .day-card .day-head h3{margin:2px 0 6px; font-size:17px;}
  .day-card .d-date{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--accent-soft);}
  .day-card .day-body{padding:0 16px 16px;}
  .item-row{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .item-row:first-child{border-top:none;}
  .item-row .t{width:52px; flex-shrink:0; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--accent-soft); padding-top:2px;}
  .item-row .c{flex:1; font-size:15px;}
  .item-row .c .note{font-size:12px;}

  form.editform{background:var(--bg-elev2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:10px 0;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%; padding:9px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:14.5px; font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .check-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .check-pill{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; user-select:none; }
  .check-pill.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:14px; font-weight:600; background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:11px 18px; cursor:pointer; width:100%; }
  .btn.secondary{background:none; border:1px solid var(--line); color:var(--text-dim); font-weight:400;}
  .btn.small{width:auto; padding:8px 14px; font-size:13px;}
  .add-toggle{margin:10px 0 22px;}

  .member-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .member-chip{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; background:var(--bg-elev2); border-radius:999px; padding:6px 12px; display:flex; align-items:center; gap:6px; }
  .member-chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:13px;}

  .plain-note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); margin-bottom:16px; padding:10px 12px; background:var(--bg-elev2); border-radius:8px;}

  .prep-cat{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
  .prep-cat .cat-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .prep-item{border-top:1px solid var(--line); padding:10px 0;}
  .prep-item:first-child{border-top:none;}
  .prep-item .txt{font-size:15px;}
  .prep-item .note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim); font-style:italic;}
  .member-check-grid{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .member-check{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer; color:var(--text-dim); }
  .member-check.done{background:var(--ok); border-color:var(--ok); color:#0d1a10; font-weight:600;}

  .todo-row, .tip-row{ display:flex; justify-content:space-between; align-items:center; background:var(--bg-elev); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px; }
  .todo-row .txt.done{text-decoration:line-through; color:var(--text-dim);}
  .todo-row .left{display:flex; align-items:center; gap:10px; flex:1;}
  .todo-check{width:18px; height:18px; border-radius:5px; border:1px solid var(--text-dim); flex-shrink:0; cursor:pointer;}
  .todo-check.done{background:var(--ok); border-color:var(--ok);}

  .ledger-summary{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:20px;}
  .ledger-summary .total{font-size:28px; font-weight:700; font-family:'Helvetica Neue',Arial,sans-serif;}
  .ledger-summary .sub{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); margin-top:2px;}

  .expense-item{ background:var(--bg-elev); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:8px; }
  .expense-item .top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .expense-item .meta{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12px; color:var(--text-dim); margin-top:3px;}
  .expense-item .note{font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; color:var(--text-dim); margin-top:4px; font-style:italic;}
  .expense-item .amt{font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; font-size:15px;}
  .paid-tracker{margin-top:12px; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px;}
  .paid-pill{ font-family:'Helvetica Neue',Arial,sans-serif; font-size:12.5px; cursor:pointer; user-select:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px; color:var(--text-dim); }
  .paid-pill.done{background:var(--ok); border-color:var(--ok); color:#0d1a10; font-weight:600;}
  .settled-tag{font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px; background:var(--ok); color:#0d1a10; padding:2px 9px; border-radius:3px; font-weight:600;}
  .del-btn{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; padding:0 0 0 10px;}
  .split-toggle{display:flex; gap:8px; margin-bottom:10px;}
  .split-toggle button{flex:1;}
  .custom-amt-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-family:'Helvetica Neue',Arial,sans-serif; font-size:13.5px;}
  .custom-amt-row input{width:90px; padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text);}

  #ledger-status, #info-status, #prep-status{font-family:'Helvetica Neue',Arial,sans-serif; font-size:13px; color:var(--text-dim); text-align:center; padding:10px 0;}
  footer{text-align:center; font-family:'Helvetica Neue',Arial,sans-serif; font-size:11.5px; color:var(--text-dim); margin-top:50px;}
</style>
</head>
<body class="night">

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">沙巴之旅<span class="sub">SABAH · 23–29 DEC 2026</span></div>
    <div style="display:flex; align-items:center;">
      <div class="tabs">
        <button class="tab-btn active" data-tab="info">旅行信息</button>
        <button class="tab-btn" data-tab="prep">准备清单</button>
        <button class="tab-btn" data-tab="ledger">记账</button>
      </div>
      <button class="theme-toggle" id="themeToggle" title="切换日夜配色">◐</button>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- ============ TAB 1: 旅行信息 ============ -->
  <div id="tab-info">

    <div class="countdown" id="countdown">
      <div class="eyebrow">此刻关注 · UP NEXT</div>
      <h2 id="cd-title">加载中…</h2>
      <div class="nums">
        <div class="num-box"><div class="num" id="cd-d">–</div><div class="lbl">天</div></div>
        <div class="num-box"><div class="num" id="cd-h">–</div><div class="lbl">时</div></div>
        <div class="num-box"><div class="num" id="cd-m">–</div><div class="lbl">分</div></div>
        <div class="num-box"><div class="num" id="cd-s">–</div><div class="lbl">秒</div></div>
      </div>
    </div>

    <h2 class="section-title">行程总览</h2>
    <div class="map-card">
      <svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
        <path d="M20,250 C30,245 35,242 40,240" fill="none" stroke="#9c8f7a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
        <path d="M40,240 C110,220 140,180 180,170" fill="none" stroke="#7fa0c9" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>
        <path d="M180,170 C220,160 250,150 290,150" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <path d="M290,150 C340,150 380,130 420,110" fill="none" stroke="#e07b5a" stroke-width="3" stroke-linecap="round"/>
        <path d="M420,110 C450,95 470,80 490,60" fill="none" stroke="#c9556b" stroke-width="3" stroke-linecap="round"/>
        <path d="M490,60 C460,90 440,120 420,150" fill="none" stroke="#c9556b" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6"/>
        <path d="M420,150 C400,190 380,220 350,235" fill="none" stroke="#8fae7c" stroke-width="3" stroke-linecap="round"/>
        <path d="M350,235 C300,250 250,250 210,245" fill="none" stroke="#8fae7c" stroke-width="3" stroke-linecap="round"/>
        <path d="M210,245 C160,235 120,225 90,220" fill="none" stroke="#7fa0c9" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>

        <circle cx="20" cy="250" r="5" fill="#9c8f7a"/>
        <text x="20" y="270" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 0</text>

        <circle cx="40" cy="240" r="6" fill="#7fa0c9"/>
        <text x="40" y="262" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">新山 JHB</text>

        <circle cx="180" cy="170" r="7" fill="var(--accent)"/>
        <text x="180" y="195" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">亚庇 · Qlio Hotel</text>
        <text x="180" y="155" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 1</text>

        <circle cx="290" cy="150" r="7" fill="#e07b5a"/>
        <text x="290" y="135" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 2</text>
        <text x="290" y="175" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">神山公园 · Sutera</text>

        <circle cx="420" cy="110" r="7" fill="#c9556b"/>
        <text x="420" y="95" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 3</text>
        <text x="420" y="135" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">拉班拉打 (半山)</text>

        <path d="M482,35 l6,14 l14,2 l-10,10 l3,14 l-13,-7 l-13,7 l3,-14 l-10,-10 l14,-2 z" fill="var(--accent-soft)"/>
        <text x="490" y="20" font-size="11" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">洛氏峰 4095m</text>

        <circle cx="350" cy="235" r="7" fill="#8fae7c"/>
        <text x="350" y="220" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 4</text>
        <text x="350" y="257" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">民宿 The Cloud</text>

        <circle cx="90" cy="220" r="6" fill="#7fa0c9"/>
        <text x="90" y="205" font-size="10.5" fill="var(--text-dim)" text-anchor="middle" font-family="Helvetica Neue,Arial">Day 6</text>
        <text x="90" y="238" font-size="12" fill="var(--text)" text-anchor="middle" font-family="Helvetica Neue,Arial">飞回新山</text>
      </svg>
      <div class="map-legend">
        <span><i class="dot" style="background:#9c8f7a"></i>另外2人先到</span>
        <span><i class="dot" style="background:var(--accent)"></i>抵达 / 市区</span>
        <span><i class="dot" style="background:#e07b5a"></i>神山公园</span>
        <span><i class="dot" style="background:#c9556b"></i>攀登两天</span>
        <span><i class="dot" style="background:#8fae7c"></i>民宿 27–29</span>
        <span><i class="dot" style="background:#7fa0c9"></i>往返机场</span>
      </div>
    </div>

    <h2 class="section-title">机票</h2>
    <div id="flightsList"></div>
    <button class="btn secondary add-toggle" id="showAddFlight">+ 添加机票</button>
    <form class="editform" id="flightForm" style="display:none;">
      <div class="field"><label>路线 / 航空公司</label><input type="text" id="flRoute" placeholder="例如：新山 ⇄ 亚庇 · AirAsia"></div>
      <div class="field"><label>去程</label><input type="text" id="flOut" placeholder="例如：12月24日 09:10 → 11:30"></div>
      <div class="field"><label>回程</label><input type="text" id="flIn" placeholder="例如：12月29日 12:40 → 15:00"></div>
      <div class="field"><label>备注</label><input type="text" id="flNote" placeholder="选填"></div>
      <div class="field"><label>适用于谁</label><div class="check-grid" id="flPeople"></div></div>
      <button class="btn" type="button" id="flSaveBtn">保存</button>
    </form>

    <h2 class="section-title">逐日行程</h2>
    <div id="daysList"></div>
    <button class="btn secondary add-toggle" id="showAddDay">+ 新增一天</button>
    <form class="editform" id="dayForm" style="display:none;">
      <div class="field"><label>日期</label><input type="text" id="dayDate" placeholder="例如：12月30日 · 周三"></div>
      <div class="field"><label>标题</label><input type="text" id="dayTitle" placeholder="例如：Day 7 · 补充行程"></div>
      <div class="field"><label>适用于谁</label><div class="check-grid" id="dayPeople"></div></div>
      <button class="btn" type="button" id="daySaveBtn">保存</button>
    </form>
    <div id="info-status"></div>
  </div>

  <!-- ============ TAB 2: 准备清单 ============ -->
  <div id="tab-prep" style="display:none;">
    <h2 class="section-title">出发前准备</h2>
    <div id="prepBefore"></div>
    <button class="btn secondary add-toggle" data-section="before">+ 新增分类</button>

    <h2 class="section-title">登山前准备</h2>
    <div id="prepClimb"></div>
    <button class="btn secondary add-toggle" data-section="climb">+ 新增分类</button>

    <form class="editform" id="catForm" style="display:none;">
      <div class="field"><label>分类名称</label><input type="text" id="catName" placeholder="例如：行李 - 电子用品"></div>
      <div class="field"><label>颜色</label><div class="check-grid" id="catColor"></div></div>
      <button class="btn" type="button" id="catSaveBtn">保存</button>
    </form>

    <h2 class="section-title">待办事项</h2>
    <div id="todoList"></div>
    <form class="editform" id="todoForm">
      <div class="field"><input type="text" id="todoText" placeholder="新增待办"></div>
      <button class="btn secondary" type="submit">+ 添加</button>
    </form>

    <h2 class="section-title">额外贴士</h2>
    <div id="tipList"></div>
    <form class="editform" id="tipForm">
      <div class="field"><input type="text" id="tipText" placeholder="新增贴士"></div>
      <button class="btn secondary" type="submit">+ 添加</button>
    </form>
    <div id="prep-status"></div>
  </div>

  <!-- ============ TAB 3: 记账 ============ -->
  <div id="tab-ledger" style="display:none;">
    <div class="plain-note">
      只记录还没结清的花费:机票和亚庇酒店已经付清,不算在这里。这里记 27–29 民宿尾款,以及吃饭、租车等旅途花销。任何一个人加的账目,大家打开都能看到同一份。
    </div>

    <div class="ledger-summary">
      <div class="total sans" id="ledgerTotal">–</div>
      <div class="sub">累计已记账金额</div>
    </div>

    <h2 class="section-title">成员</h2>
    <div class="member-row" id="memberRow"></div>
    <form class="editform" id="addMemberForm">
      <div class="field"><input type="text" id="newMemberName" placeholder="新成员名字"></div>
      <button class="btn secondary" type="submit">+ 添加成员</button>
    </form>

    <h2 class="section-title">记一笔</h2>
    <form class="editform" id="addExpenseForm">
      <div class="field"><label>这笔花的是什么</label><input type="text" id="expDesc" placeholder="例如：晚餐、租车、门票" required></div>
      <div class="field"><label>备注（选填）</label><input type="text" id="expNote" placeholder="例如：Sutera Sanctuary 附近那家海鲜档"></div>
      <div class="field"><label>金额 (MYR，已含税/服务费请直接填总额)</label><input type="number" id="expAmount" step="0.01" min="0" placeholder="0.00" required></div>
      <div class="field"><label>谁先垫付的</label><select id="expPayer"></select></div>
      <div class="field"><label>平分给谁 (可多选)</label><div class="check-grid" id="expParticipants"></div></div>
      <div class="field">
        <label>怎么分</label>
        <div class="split-toggle">
          <button class="btn secondary" type="button" id="splitEvenBtn">均分</button>
          <button class="btn secondary" type="button" id="splitCustomBtn">自定义金额</button>
        </div>
      </div>
      <div class="field" id="customAmountsWrap" style="display:none;"></div>
      <button class="btn" type="submit">添加账目</button>
    </form>

    <h2 class="section-title">账目明细</h2>
    <div id="expenseList"></div>
    <div id="ledger-status"></div>
  </div>

</div>

<footer>沙巴旅行手册 · 大家共享</footer>

<script>
/* =================== 全局状态 =================== */
let state = { members: [], flights: [], days: [], prep: { before: [], climb: [] }, todos: [], tips: [], expenses: [] };
let selectedParticipants = new Set();
let splitMode = 'even';
let editingFlightId = null;
let editingDayId = null;
let editingCatSection = null;
let editingCatId = null;

const EVENTS = [
  { t: '2026-12-23T00:00:00+08:00', label: '另外2人先出发' },
  { t: '2026-12-24T09:10:00+08:00', label: '出发！新山飞往亚庇' },
  { t: '2026-12-24T14:00:00+08:00', label: 'Qlio Hotel 可以办理入住' },
  { t: '2026-12-25T15:00:00+08:00', label: '神山公园 Sutera 入住' },
  { t: '2026-12-26T07:00:00+08:00', label: '开始攀登神山' },
  { t: '2026-12-27T02:30:00+08:00', label: '冲顶看日出出发' },
  { t: '2026-12-27T15:00:00+08:00', label: '入住民宿 The Cloud Kinabalu' },
  { t: '2026-12-29T12:40:00+08:00', label: '搭机返回新山' }
];

/* =================== 主题 =================== */
let manualTheme = null;
function applyTheme(){
  try{
    const hour = new Date().getHours();
    const auto = (hour >= 6 && hour < 18) ? 'day' : 'night';
    document.body.className = manualTheme || auto;
  }catch(e){ console.error('theme error', e); }
}
try{
  document.getElementById('themeToggle').addEventListener('click', () => {
    manualTheme = document.body.className === 'night' ? 'day' : 'night';
    document.body.className = manualTheme;
  });
}catch(e){}
applyTheme();
setInterval(applyTheme, 60000);

/* =================== 倒计时 =================== */
function updateCountdown(){
  try{
    const now = new Date();
    const next = EVENTS.find(e => new Date(e.t) > now);
    if(!next){
      document.getElementById('cd-title').textContent = '旅程已经结束啦 🎉';
      ['cd-d','cd-h','cd-m','cd-s'].forEach(id => document.getElementById(id).textContent = '0');
      return;
    }
    document.getElementById('cd-title').textContent = next.label;
    const diff = new Date(next.t) - now;
    document.getElementById('cd-d').textContent = Math.floor(diff / 86400000);
    document.getElementById('cd-h').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
    document.getElementById('cd-m').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    document.getElementById('cd-s').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
  }catch(e){ console.error('countdown error', e); }
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* =================== 工具 =================== */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function colorClassFor(people){
  const total = state.members.length;
  if(!people || people.length === 0) return 'clr-cream';
  if(total > 0 && people.length === total) return 'clr-all';
  const palette = ['clr-cream','clr-gold','clr-sage','clr-sky','clr-rose'];
  const sig = [...people].sort().join('|');
  let h = 0;
  for(let i=0;i<sig.length;i++) h = (h * 31 + sig.charCodeAt(i)) >>> 0;
  return palette[h % palette.length];
}

function peopleTagsHtml(people){
  const cls = colorClassFor(people);
  return (people||[]).map(p => `<span class="tag-chip ${cls}">${esc(p)}</span>`).join('') || '<span class="tag-chip clr-cream">未指定</span>';
}

function checkGridHtml(containerId, selectedSet){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  state.members.forEach(m => {
    const pill = document.createElement('div');
    pill.className = 'check-pill' + (selectedSet.has(m) ? ' sel' : '');
    pill.textContent = m;
    pill.addEventListener('click', () => {
      if(selectedSet.has(m)) selectedSet.delete(m); else selectedSet.add(m);
      pill.classList.toggle('sel');
    });
    el.appendChild(pill);
  });
}

/* =================== 数据加载 =================== */
async function loadAll(){
  try{
    const res = await fetch('/api/expenses');
    if(!res.ok) throw new Error('bad response');
    state = await res.json();
    renderInfo();
    renderPrep();
    renderLedger();
  }catch(err){
    console.error(err);
    ['info-status','prep-status','ledger-status'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.textContent = '还没连上后端（需要先在 Cloudflare 完成 KV 数据库绑定）。';
    });
  }
}

async function postAction(payload){
  const res = await fetch('/api/expenses', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('request failed');
  state = await res.json();
  renderInfo();
  renderPrep();
  renderLedger();
}

/* =================== TAB 1: 旅行信息 =================== */
function renderInfo(){
  try{
    const flightsEl = document.getElementById('flightsList');
    flightsEl.innerHTML = '';
    state.flights.forEach((f, idx) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="top-row">
          <div>
            <div>${peopleTagsHtml(f.people)}</div>
            <h3>${esc(f.route)}</h3>
            <div class="row">${esc(f.outbound)}</div>
            ${f.inbound ? `<div class="row">${esc(f.inbound)}</div>` : ''}
            ${f.note ? `<div class="note">${esc(f.note)}</div>` : ''}
          </div>
          <div class="icon-btns">
            <button class="icon-btn" data-act="up">↑</button>
            <button class="icon-btn" data-act="down">↓</button>
            <button class="icon-btn" data-act="edit">✎</button>
            <button class="icon-btn" data-act="del">🗑</button>
          </div>
        </div>
      `;
      div.querySelector('[data-act=up]').addEventListener('click', () => postAction({action:'moveFlight', id:f.id, dir:'up'}));
      div.querySelector('[data-act=down]').addEventListener('click', () => postAction({action:'moveFlight', id:f.id, dir:'down'}));
      div.querySelector('[data-act=del]').addEventListener('click', () => { if(confirm('删除这条机票？')) postAction({action:'deleteFlight', id:f.id}); });
      div.querySelector('[data-act=edit]').addEventListener('click', () => openFlightForm(f));
      flightsEl.appendChild(div);
    });

    const daysEl = document.getElementById('daysList');
    daysEl.innerHTML = '';
    state.days.forEach(d => {
      const card = document.createElement('div');
      card.className = 'day-card';
      const itemsHtml = d.items.map(it => `
        <div class="item-row" data-item="${it.id}">
          <div class="t">${esc(it.time)}</div>
          <div class="c">
            ${esc(it.text)}${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
          </div>
          <div class="icon-btns">
            <button class="icon-btn" data-act="up">↑</button>
            <button class="icon-btn" data-act="down">↓</button>
            <button class="icon-btn" data-act="del">🗑</button>
          </div>
        </div>
      `).join('');
      card.innerHTML = `
        <div class="day-head">
          <div>
            <div class="d-date">${esc(d.date)}</div>
            <h3>${esc(d.title)}</h3>
            <div>${peopleTagsHtml(d.people)}</div>
          </div>
          <div class="icon-btns">
            <button class="icon-btn" data-act="up">↑</button>
            <button class="icon-btn" data-act="down">↓</button>
            <button class="icon-btn" data-act="edit">✎</button>
            <button class="icon-btn" data-act="del">🗑</button>
          </div>
        </div>
        <div class="day-body">
          ${itemsHtml}
          <form class="editform" style="margin-top:10px;">
            <div class="field"><input type="text" placeholder="时间（选填）" class="itTime"></div>
            <div class="field"><input type="text" placeholder="内容" class="itText"></div>
            <div class="field"><input type="text" placeholder="备注（选填）" class="itNote"></div>
            <button class="btn small" type="button">+ 添加当天项目</button>
          </form>
        </div>
      `;
      card.querySelectorAll('.day-head .icon-btn')[0].addEventListener('click', () => postAction({action:'moveDay', id:d.id, dir:'up'}));
      card.querySelectorAll('.day-head .icon-btn')[1].addEventListener('click', () => postAction({action:'moveDay', id:d.id, dir:'down'}));
      card.querySelectorAll('.day-head .icon-btn')[2].addEventListener('click', () => openDayForm(d));
      card.querySelectorAll('.day-head .icon-btn')[3].addEventListener('click', () => { if(confirm('删除这一天？')) postAction({action:'deleteDay', id:d.id}); });

      card.querySelectorAll('.item-row').forEach(row => {
        const itemId = row.dataset.item;
        const btns = row.querySelectorAll('.icon-btn');
        btns[0].addEventListener('click', () => postAction({action:'moveDayItem', dayId:d.id, id:itemId, dir:'up'}));
        btns[1].addEventListener('click', () => postAction({action:'moveDayItem', dayId:d.id, id:itemId, dir:'down'}));
        btns[2].addEventListener('click', () => { if(confirm('删除这一项？')) postAction({action:'deleteDayItem', dayId:d.id, id:itemId}); });
      });

      const addBtn = card.querySelector('.day-body .btn.small');
      addBtn.addEventListener('click', () => {
        const time = card.querySelector('.itTime').value.trim();
        const text = card.querySelector('.itText').value.trim();
        const note = card.querySelector('.itNote').value.trim();
        if(!text) return;
        postAction({action:'addDayItem', dayId:d.id, time, text, note});
      });

      daysEl.appendChild(card);
    });
  }catch(e){ console.error('renderInfo error', e); }
}

function openFlightForm(f){
  editingFlightId = f ? f.id : null;
  document.getElementById('flightForm').style.display = 'block';
  document.getElementById('flRoute').value = f ? f.route : '';
  document.getElementById('flOut').value = f ? f.outbound : '';
  document.getElementById('flIn').value = f ? f.inbound : '';
  document.getElementById('flNote').value = f ? f.note : '';
  const sel = new Set(f ? f.people : []);
  checkGridHtml('flPeople', sel);
  document.getElementById('flightForm')._selected = sel;
}
document.getElementById('showAddFlight').addEventListener('click', () => openFlightForm(null));
document.getElementById('flSaveBtn').addEventListener('click', () => {
  const form = document.getElementById('flightForm');
  const payload = {
    route: document.getElementById('flRoute').value.trim(),
    outbound: document.getElementById('flOut').value.trim(),
    inbound: document.getElementById('flIn').value.trim(),
    note: document.getElementById('flNote').value.trim(),
    people: [...form._selected]
  };
  if(editingFlightId){ payload.action = 'updateFlight'; payload.id = editingFlightId; }
  else { payload.action = 'addFlight'; }
  postAction(payload);
  form.style.display = 'none';
});

function openDayForm(d){
  editingDayId = d ? d.id : null;
  document.getElementById('dayForm').style.display = 'block';
  document.getElementById('dayDate').value = d ? d.date : '';
  document.getElementById('dayTitle').value = d ? d.title : '';
  const sel = new Set(d ? d.people : [...state.members]);
  checkGridHtml('dayPeople', sel);
  document.getElementById('dayForm')._selected = sel;
}
document.getElementById('showAddDay').addEventListener('click', () => openDayForm(null));
document.getElementById('daySaveBtn').addEventListener('click', () => {
  const form = document.getElementById('dayForm');
  const payload = {
    date: document.getElementById('dayDate').value.trim(),
    title: document.getElementById('dayTitle').value.trim(),
    people: [...form._selected]
  };
  if(editingDayId){ payload.action = 'updateDay'; payload.id = editingDayId; }
  else { payload.action = 'addDay'; }
  postAction(payload);
  form.style.display = 'none';
});

/* =================== TAB 2: 准备清单 =================== */
const COLOR_OPTIONS = ['cream','gold','sage','sky','rose'];

function renderPrepSection(section, containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  (state.prep[section] || []).forEach(cat => {
    const div = document.createElement('div');
    div.className = 'prep-cat';
    const itemsHtml = cat.items.map(it => {
      const checks = it.checks || {};
      const chkHtml = state.members.map(m => {
        const done = !!checks[m];
        return `<div class="member-check${done?' done':''}" data-member="${esc(m)}">${esc(m)}</div>`;
      }).join('');
      return `
        <div class="prep-item" data-item="${it.id}">
          <div class="top-row">
            <div>
              <div class="txt">${esc(it.text)}</div>
              ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
            </div>
            <button class="icon-btn" data-act="delitem">🗑</button>
          </div>
          <div class="member-check-grid">${chkHtml}</div>
        </div>
      `;
    }).join('');
    div.innerHTML = `
      <div class="cat-head">
        <div><span class="tag-chip clr-${cat.color || 'cream'}">${esc(cat.name)}</span></div>
        <div class="icon-btns">
          <button class="icon-btn" data-act="editcat">✎</button>
          <button class="icon-btn" data-act="delcat">🗑</button>
        </div>
      </div>
      ${itemsHtml}
      <form class="editform" style="margin-top:10px;">
        <div class="field"><input type="text" placeholder="新增物品" class="newItemText"></div>
        <div class="field"><input type="text" placeholder="备注（选填）" class="newItemNote"></div>
        <button class="btn small" type="button">+ 添加</button>
      </form>
    `;
    div.querySelector('[data-act=delcat]').addEventListener('click', () => {
      if(confirm('删除这个分类（连同里面的物品）？')) postAction({action:'deletePrepCategory', section, id:cat.id});
    });
    div.querySelector('[data-act=editcat]').addEventListener('click', () => openCatForm(section, cat));
    div.querySelectorAll('.prep-item').forEach(row => {
      const itemId = row.dataset.item;
      row.querySelector('[data-act=delitem]').addEventListener('click', () => {
        if(confirm('删除这一项？')) postAction({action:'deletePrepItem', section, categoryId:cat.id, id:itemId});
      });
      row.querySelectorAll('.member-check').forEach(chk => {
        chk.addEventListener('click', () => {
          const member = chk.dataset.member;
          const done = chk.classList.contains('done');
          postAction({action:'togglePrepCheck', section, categoryId:cat.id, id:itemId, member, value: !done});
        });
      });
    });
    const addBtn = div.querySelector('.editform .btn.small');
    addBtn.addEventListener('click', () => {
      const text = div.querySelector('.newItemText').value.trim();
      const note = div.querySelector('.newItemNote').value.trim();
      if(!text) return;
      postAction({action:'addPrepItem', section, categoryId:cat.id, text, note});
    });
    el.appendChild(div);
  });
}

function openCatForm(section, cat){
  editingCatSection = section;
  editingCatId = cat ? cat.id : null;
  document.getElementById('catForm').style.display = 'block';
  document.getElementById('catName').value = cat ? cat.name : '';
  const colorEl = document.getElementById('catColor');
  colorEl.innerHTML = '';
  const chosen = { v: cat ? (cat.color || 'cream') : 'cream' };
  COLOR_OPTIONS.forEach(c => {
    const pill = document.createElement('div');
    pill.className = 'check-pill' + (chosen.v === c ? ' sel' : '');
    pill.textContent = c;
    pill.addEventListener('click', () => {
      colorEl.querySelectorAll('.check-pill').forEach(p => p.classList.remove('sel'));
      pill.classList.add('sel');
      chosen.v = c;
    });
    colorEl.appendChild(pill);
  });
  document.getElementById('catForm')._chosen = chosen;
}
document.querySelectorAll('#tab-prep .add-toggle').forEach(btn => {
  btn.addEventListener('click', () => openCatForm(btn.dataset.section, null));
});
document.getElementById('catSaveBtn').addEventListener('click', () => {
  const form = document.getElementById('catForm');
  const name = document.getElementById('catName').value.trim();
  if(!name) return;
  const color = form._chosen.v;
  if(editingCatId) postAction({action:'updatePrepCategory', section:editingCatSection, id:editingCatId, name, color});
  else postAction({action:'addPrepCategory', section:editingCatSection, name, color});
  form.style.display = 'none';
});

function renderPrep(){
  try{
    renderPrepSection('before', 'prepBefore');
    renderPrepSection('climb', 'prepClimb');

    const todoEl = document.getElementById('todoList');
    todoEl.innerHTML = '';
    state.todos.forEach(t => {
      const row = document.createElement('div');
      row.className = 'todo-row';
      row.innerHTML = `
        <div class="left">
          <div class="todo-check${t.done?' done':''}"></div>
          <div class="txt${t.done?' done':''}">${esc(t.text)}</div>
        </div>
        <button class="del-btn">🗑</button>
      `;
      row.querySelector('.todo-check').addEventListener('click', () => postAction({action:'toggleTodo', id:t.id, done: !t.done}));
      row.querySelector('.del-btn').addEventListener('click', () => postAction({action:'deleteTodo', id:t.id}));
      todoEl.appendChild(row);
    });

    const tipEl = document.getElementById('tipList');
    tipEl.innerHTML = '';
    state.tips.forEach(t => {
      const row = document.createElement('div');
      row.className = 'tip-row';
      row.innerHTML = `<div class="txt">${esc(t.text)}</div><button class="del-btn">🗑</button>`;
      row.querySelector('.del-btn').addEventListener('click', () => postAction({action:'deleteTip', id:t.id}));
      tipEl.appendChild(row);
    });
  }catch(e){ console.error('renderPrep error', e); }
}

document.getElementById('todoForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('todoText');
  const text = input.value.trim();
  if(!text) return;
  postAction({action:'addTodo', text});
  input.value = '';
});
document.getElementById('tipForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('tipText');
  const text = input.value.trim();
  if(!text) return;
  postAction({action:'addTip', text});
  input.value = '';
});

/* =================== TAB 3: 记账 =================== */
function renderLedger(){
  try{
    const memberRow = document.getElementById('memberRow');
    memberRow.innerHTML = '';
    state.members.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'member-chip';
      chip.innerHTML = `<span>${esc(m)}</span><button data-name="${esc(m)}">✕</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        if(confirm(`把 ${m} 从成员名单移除？`)) postAction({action:'removeMember', name:m});
      });
      memberRow.appendChild(chip);
    });

    const payerSel = document.getElementById('expPayer');
    payerSel.innerHTML = state.members.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');

    if(selectedParticipants.size === 0) state.members.forEach(m => selectedParticipants.add(m));
    checkGridHtml('expParticipants', selectedParticipants);
    renderCustomAmounts();

    const listEl = document.getElementById('expenseList');
    listEl.innerHTML = '';
    if(state.expenses.length === 0){
      listEl.innerHTML = '<div class="plain-note">还没有账目，添加第一笔吧。</div>';
    }
    [...state.expenses].sort((a,b) => b.createdAt - a.createdAt).forEach(e => {
      const div = document.createElement('div');
      div.className = 'expense-item';
      const owers = e.participants.filter(p => p !== e.payer);
      const paidMap = e.paid || {};
      const allSettled = owers.length > 0 && owers.every(p => paidMap[p]);
      const shareOf = (p) => e.splitMode === 'custom' && e.customAmounts ? (e.customAmounts[p] || 0) : (e.amount / e.participants.length);

      const trackerHtml = owers.length
        ? `<div class="paid-tracker">${owers.map(p => {
            const done = !!paidMap[p];
            return `<div class="paid-pill${done?' done':''}" data-person="${esc(p)}">${done?'✓ ':''}${esc(p)} RM${shareOf(p).toFixed(2)}</div>`;
          }).join('')}</div>`
        : '';

      div.innerHTML = `
        <div class="top-row">
          <div>
            <div>${esc(e.desc)}${allSettled ? '<span class="settled-tag" style="margin-left:8px;">已结清</span>' : ''}</div>
            <div class="meta">${esc(e.payer)} 垫付 · ${e.splitMode === 'custom' ? '自定义金额' : e.participants.length + '人平分'}</div>
            ${e.note ? `<div class="note">${esc(e.note)}</div>` : ''}
          </div>
          <div style="text-align:right; display:flex; align-items:center;">
            <div class="amt">RM${e.amount.toFixed(2)}</div>
            <button class="del-btn" title="删除">🗑</button>
          </div>
        </div>
        ${trackerHtml}
      `;
      div.querySelector('.del-btn').addEventListener('click', () => postAction({action:'deleteExpense', id:e.id}));
      div.querySelectorAll('.paid-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const person = pill.dataset.person;
          postAction({action:'setPaid', id:e.id, person, paid: !paidMap[person]});
        });
      });
      listEl.appendChild(div);
    });

    const total = state.expenses.reduce((s,e) => s + e.amount, 0);
    document.getElementById('ledgerTotal').textContent = 'RM ' + total.toFixed(2);
  }catch(e){ console.error('renderLedger error', e); }
}

function renderCustomAmounts(){
  const wrap = document.getElementById('customAmountsWrap');
  if(splitMode !== 'custom'){ wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.style.display = 'block';
  wrap.innerHTML = '<label>每人金额</label>';
  [...selectedParticipants].forEach(p => {
    const row = document.createElement('div');
    row.className = 'custom-amt-row';
    row.innerHTML = `<span>${esc(p)}</span><input type="number" step="0.01" min="0" class="custAmt" data-name="${esc(p)}" placeholder="0.00">`;
    wrap.appendChild(row);
  });
}

document.getElementById('splitEvenBtn').addEventListener('click', () => { splitMode = 'even'; renderCustomAmounts(); });
document.getElementById('splitCustomBtn').addEventListener('click', () => { splitMode = 'custom'; renderCustomAmounts(); });

document.getElementById('addMemberForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('newMemberName');
  const name = input.value.trim();
  if(!name) return;
  postAction({action:'addMember', name});
  input.value = '';
});

document.getElementById('addExpenseForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const desc = document.getElementById('expDesc').value.trim();
  const note = document.getElementById('expNote').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const payer = document.getElementById('expPayer').value;
  const participants = [...selectedParticipants];
  if(!desc || !amount || !payer || participants.length === 0) return;
  const payload = {action:'addExpense', desc, note, amount, payer, participants, splitMode};
  if(splitMode === 'custom'){
    const customAmounts = {};
    document.querySelectorAll('.custAmt').forEach(inp => { customAmounts[inp.dataset.name] = parseFloat(inp.value) || 0; });
    payload.customAmounts = customAmounts;
  }
  postAction(payload);
  document.getElementById('expDesc').value = '';
  document.getElementById('expNote').value = '';
  document.getElementById('expAmount').value = '';
});

/* =================== Tabs =================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-info').style.display = tab === 'info' ? '' : 'none';
    document.getElementById('tab-prep').style.display = tab === 'prep' ? '' : 'none';
    document.getElementById('tab-ledger').style.display = tab === 'ledger' ? '' : 'none';
    loadAll();
  });
});

loadAll();
</script>
</body>
</html>
